<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obsidian">
<title>Quickdraw · iPad</title>
<link rel="stylesheet" href="qd/quickdraw.css">
<style>
  :root { --chip-bg: rgba(255,253,249,.94); --chip-ink: #1C1814; --chip-ink-2: #6F675C; --chip-line: rgba(44,33,22,.12); --live: #129E77; --mark: #A39B8F; }
  [data-scheme="dark"] { --chip-bg: rgba(44,42,38,.94); --chip-ink: #F1EDE6; --chip-ink-2: #9A9286; --chip-line: rgba(255,255,255,.1); --live: #5EDDB0; --mark: #6B655C; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; position: fixed; inset: 0; background: #fbf9f4; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
  [data-scheme="dark"] body { background: #191713; }
  #app { position: fixed; inset: 0; }
  .chip { position: fixed; z-index: 9999; display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 4px; border-radius: 18px; background: var(--chip-bg); border: 1px solid var(--chip-line); color: var(--chip-ink); font: 600 13px/1 -apple-system, system-ui, sans-serif; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .chip button { all: unset; height: 30px; min-width: 30px; padding: 0 10px; box-sizing: border-box; border-radius: 15px; display: grid; place-items: center; cursor: pointer; }
  .chip button:active { background: rgba(127,127,127,.18); }
  #pen { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; }
  #pen.off button { color: var(--chip-ink-2); }
  #status { top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; padding: 0 12px; gap: 8px; pointer-events: none; transition: opacity .4s; }
  #status i { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); }
  #status.live i { background: var(--live); }
  #status.live.quiet { opacity: 0; }
  #ended { position: fixed; inset: 0; z-index: 9998; display: none; place-items: center; background: rgba(20,18,14,.18); color: #fff; font: 600 17px/1.35 -apple-system, system-ui, sans-serif; text-align: center; }
  #ended div { padding: 14px 20px; border-radius: 14px; background: rgba(20,18,14,.74); }
  body.ended #ended { display: grid; }
</style>
</head>
<body>
<div id="app"></div>
<div id="pen" class="chip" style="display:none"><button type="button">Pen only</button></div>
<div id="status" class="chip"><i></i><span id="stext">Connecting…</span></div>
<div id="ended"><div>The drawing is saved in your note.<br>Scan the code on the Mac to draw again.</div></div>
<script type="module">
// Drawing on a note from an iPad. This page runs the same Quickdraw engine as the Mac, on a mirror of the drawing
// open there: its strokes go to the Mac as diffs, flagged while the pen is still down, and everything done on the
// Mac comes back. The Mac's drawing is the one that's kept, and its undo is the only one.
import { createQuickdraw, streamDiffs, unpackDiff } from './qd/index.js'

const $ = (id) => document.getElementById(id)
const board = createQuickdraw({ container: $('app'), theme: 'light', grid: 'dots', watermark: false })
const { editor } = board
const store = editor.store
editor.setTool('draw')

// ---- connection --------------------------------------------------------------
let ws = null
let retry = 0
const send = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)) }
const status = (text, live) => {
  $('stext').textContent = text
  $('status').classList.toggle('live', !!live)
  $('status').classList.remove('quiet')
  if (live) setTimeout(() => $('status').classList.add('quiet'), 1800)
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname)
  ws.onopen = () => { retry = 0; send({ type: 'hello' }); status('Connected to Obsidian', true) }
  ws.onclose = (e) => {
    if (e.code === 4000 || e.code === 4001) {
      editor.setReadonly(true)
      document.body.classList.add('ended')
      status('Drawing closed on the Mac')
      return
    }
    status('Reconnecting…')
    setTimeout(connect, Math.min(4000, 400 * 2 ** retry++))
  }
  ws.onmessage = (ev) => {
    let m
    try { m = JSON.parse(ev.data) } catch { return }
    try { onMessage(m) } catch (e) { console.error(e) }
  }
}

// ---- one undo stack: the Mac's ---------------------------------------------------
const remote = { canUndo: false, canRedo: false }
store.undo = () => send({ type: 'undo' })
store.redo = () => send({ type: 'redo' })
Object.defineProperty(store, 'canUndo', { get: () => remote.canUndo })
Object.defineProperty(store, 'canRedo', { get: () => remote.canRedo })

// ---- edits out: every local change, flagged while a stroke is still going ----
// Packed (a growing stroke sends only its new points) and gathered while the link is busy, so a slow network
// skips ahead to where the stroke is instead of replaying it.
let open = false
const out = streamDiffs(store, {
  send: (changes, o) => { open = o; send({ type: 'changes', changes, open: o }) },
  busy: () => !!ws && ws.bufferedAmount > 0,
})
store.listenHistory(() => {
  if (store._batch) return
  out.flush()
  if (open) { open = false; send({ type: 'gestureEnd' }) }
})

// ---- edits in ------------------------------------------------------------------
// Theme and grid are the Mac's, and the menu here switches them for both.
function setScheme(theme) {
  document.documentElement.dataset.scheme = theme
  if (editor.theme.id !== theme) editor.setTheme(theme)
}
editor.on('theme', () => {
  document.documentElement.dataset.scheme = editor.theme.id
  send({ type: 'theme', theme: editor.theme.id })
})
editor.on('grid', () => send({ type: 'grid', grid: editor.grid }))
let first = true
function onMessage(m) {
  if (m.type === 'init') {
    store.loadSnapshot(m.snapshot)
    if (m.theme) setScheme(m.theme)
    if (m.grid) editor.setGrid(m.grid)
    if (m.history) onMessage({ type: 'history', ...m.history })
    // The whole drawing in view the first time; after a reconnect, the view stays where it was.
    if (first) { first = false; editor.fitContent({ maxZoom: 1 }) }
  } else if (m.type === 'changes' && m.changes) {
    store.applyDiff(unpackDiff(m.changes, store), 'remote')
  } else if (m.type === 'theme') {
    setScheme(m.theme)
  } else if (m.type === 'grid') {
    editor.setGrid(m.grid)
  } else if (m.type === 'history') {
    remote.canUndo = !!m.canUndo
    remote.canRedo = !!m.canRedo
    store._notifyHistory()
  }
}

// ---- pen ---------------------------------------------------------------------------
const syncPen = () => {
  $('pen').style.display = 'flex'
  $('pen').querySelector('button').textContent = editor.penMode ? 'Pen only' : 'Pen only · off'
  $('pen').classList.toggle('off', !editor.penMode)
}
editor.on('penmode', syncPen)
$('pen').querySelector('button').onclick = () => { editor.setPenMode(!editor.penMode); syncPen() }

// ---- laser -------------------------------------------------------------------------
let lastScrib = ''
const shipScribbles = () => {
  const j = JSON.stringify(editor.getScribbles())
  if (j !== lastScrib) { lastScrib = j; send({ type: 'scribbles', scribbles: JSON.parse(j) }) }
}
editor.on('scribbles', shipScribbles)
setInterval(shipScribbles, 80)

connect()
</script>
</body>
</html>
